# render.yaml — Render.com Deployment Blueprint
# Place this file at the root of your repo: e-com.site/ecommerce-project/render.yaml

services:
  # ──────────────────────────────────────────
  # 1. Backend — Node.js Express API
  # ──────────────────────────────────────────
  - type: web
    name: mega-mart-backend
    env: node
    region: singapore   # choose closest region to India
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URL
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false   # set manually in Render dashboard
      - key: FRONTEND_URL
        fromService:
          name: mega-mart-frontend
          type: web
          property: host
          envVarPrefix: https://

  # ──────────────────────────────────────────
  # 2. Frontend — React Static Site
  # ──────────────────────────────────────────
  - type: web
    name: mega-mart-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: mega-mart-backend
          type: web
          property: host
          envVarPrefix: https://
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
